modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET

  http_ngrok:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: "ipv4"
      method: GET
      headers:
        # This header tells Ngrok "I am a real user, let me in"
        ngrok-skip-browser-warning: "true"
        User-Agent: "Blackbox Exporter"
      valid_status_codes: [200, 204, 401, 403200, 204, 401, 403]  # Defaults to 2xx 
