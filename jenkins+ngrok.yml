---
- name: Install and Configure Jenkins with ngrok
  hosts: all
  become: true
  vars:
    jenkins_port: 8080
    ngrok_authtoken: "YOUR_NGROK_AUTHTOKEN"   # <-- Replace with your token
    ngrok_version: "3"
    java_package: "java-17-openjdk"

  handlers:
    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted
        daemon_reload: true

    - name: Restart ngrok
      systemd:
        name: ngrok-jenkins
        state: restarted
        daemon_reload: true

  # ─────────────────────────────────────────
  # PRE-CHECKS
  # ─────────────────────────────────────────
  pre_tasks:
    - name: Assert ngrok auth token is set
      assert:
        that:
          - ngrok_authtoken != "YOUR_NGROK_AUTHTOKEN"
          - ngrok_authtoken | length > 0
        fail_msg: >
          Please set the 'ngrok_authtoken' variable before running this playbook.
          You can pass it with: -e "ngrok_authtoken=<your_token>"

    - name: Gather OS family
      setup:
        filter: ansible_os_family

  # ─────────────────────────────────────────
  # TASKS
  # ─────────────────────────────────────────
  tasks:

    # ── Java ──────────────────────────────
    - name: Install Java (RedHat)
      package:
        name: "{{ java_package }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Java (Debian)
      package:
        name: openjdk-17-jdk
        state: present
      when: ansible_os_family == "Debian"

    - name: Verify Java installation
      command: java -version
      register: java_check
      changed_when: false
      failed_when: java_check.rc != 0

    # ── Jenkins ───────────────────────────
    - name: Add Jenkins GPG key (Debian)
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'
      when: ansible_os_family == "Debian"

    - name: Add Jenkins apt repository (Debian)
      apt_repository:
        repo: >
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc]
          https://pkg.jenkins.io/debian-stable binary/
        state: present
        filename: jenkins
      when: ansible_os_family == "Debian"

    - name: Add Jenkins yum repository (RedHat)
      get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: '0644'
      when: ansible_os_family == "RedHat"

    - name: Import Jenkins GPG key (RedHat)
      rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
      when: ansible_os_family == "RedHat"

    - name: Install Jenkins
      package:
        name: jenkins
        state: present
        update_cache: true

    - name: Enable and start Jenkins service
      systemd:
        name: jenkins
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Jenkins to become available
      wait_for:
        port: "{{ jenkins_port }}"
        host: 127.0.0.1
        delay: 10
        timeout: 120
        msg: "Jenkins did not start on port {{ jenkins_port }} in time"

    - name: Verify Jenkins service is running
      systemd:
        name: jenkins
      register: jenkins_status
      failed_when: jenkins_status.status.ActiveState != "active"

    # ── ngrok ─────────────────────────────
    - name: Install unzip (required for ngrok extraction)
      package:
        name: unzip
        state: present

    - name: Download ngrok installer script
      get_url:
        url: https://ngrok-agent.s3.amazonaws.com/ngrok.asc
        dest: /usr/share/keyrings/ngrok.asc
        mode: '0644'
      when: ansible_os_family == "Debian"

    - name: Add ngrok apt repository (Debian)
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/ngrok.asc] https://ngrok-agent.s3.amazonaws.com buster main"
        state: present
        filename: ngrok
      when: ansible_os_family == "Debian"

    - name: Install ngrok via apt (Debian)
      package:
        name: ngrok
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Download and install ngrok binary (RedHat / fallback)
      block:
        - name: Download ngrok archive
          get_url:
            url: "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz"
            dest: /tmp/ngrok.tgz
            mode: '0644'

        - name: Extract ngrok to /usr/local/bin
          unarchive:
            src: /tmp/ngrok.tgz
            dest: /usr/local/bin
            remote_src: true
            mode: '0755'

        - name: Remove ngrok archive
          file:
            path: /tmp/ngrok.tgz
            state: absent
      when: ansible_os_family == "RedHat"

    - name: Verify ngrok binary exists
      command: ngrok version
      register: ngrok_version_check
      changed_when: false
      failed_when: ngrok_version_check.rc != 0

    - name: Authenticate ngrok
      command: ngrok config add-authtoken "{{ ngrok_authtoken }}"
      changed_when: true
      no_log: true   # hide token from logs

    - name: Create ngrok config directory
      file:
        path: /etc/ngrok
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write ngrok YAML config
      copy:
        dest: /etc/ngrok/ngrok.yml
        owner: root
        group: root
        mode: '0600'
        content: |
          version: "2"
          authtoken: {{ ngrok_authtoken }}
          tunnels:
            jenkins:
              proto: http
              addr: {{ jenkins_port }}
              inspect: false
      notify: Restart ngrok

    # ── ngrok systemd service ─────────────
    - name: Create ngrok-jenkins systemd unit
      copy:
        dest: /etc/systemd/system/ngrok-jenkins.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=ngrok tunnel for Jenkins
          After=network.target jenkins.service
          Requires=jenkins.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/ngrok start --config /etc/ngrok/ngrok.yml jenkins
          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=ngrok-jenkins
          # Prevent token leaking into journald metadata
          Environment="NGROK_AUTHTOKEN={{ ngrok_authtoken }}"

          [Install]
          WantedBy=multi-user.target
      notify: Restart ngrok

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start ngrok-jenkins service
      systemd:
        name: ngrok-jenkins
        enabled: true
        state: started

    - name: Wait for ngrok tunnel to initialise
      pause:
        seconds: 8

    # ─────────────────────────────────────────
    # TESTS / VERIFICATION
    # ─────────────────────────────────────────
    - name: "[TEST] Jenkins HTTP responds on localhost"
      uri:
        url: "http://127.0.0.1:{{ jenkins_port }}/login"
        method: GET
        status_code: [200, 403]
        timeout: 30
      register: jenkins_http_test

    - name: "[TEST] Jenkins service is active"
      command: systemctl is-active jenkins
      register: jenkins_active
      changed_when: false
      failed_when: jenkins_active.stdout != "active"

    - name: "[TEST] ngrok-jenkins service is active"
      command: systemctl is-active ngrok-jenkins
      register: ngrok_active
      changed_when: false
      failed_when: ngrok_active.stdout != "active"

    - name: "[TEST] Retrieve ngrok public URL via local API"
      uri:
        url: "http://127.0.0.1:4040/api/tunnels"
        method: GET
        return_content: true
        timeout: 15
      register: ngrok_api
      retries: 5
      delay: 5
      until: ngrok_api.status == 200

    - name: "[TEST] Parse and display ngrok public URL"
      set_fact:
        ngrok_public_url: >-
          {{ (ngrok_api.content | from_json).tunnels
             | selectattr('name', 'equalto', 'jenkins')
             | map(attribute='public_url')
             | first }}

    # ─────────────────────────────────────────
    # SUMMARY
    # ─────────────────────────────────────────
    - name: Print deployment summary
      debug:
        msg:
          - "============================================="
          - " Jenkins + ngrok Deployment Summary"
          - "============================================="
          - "Jenkins local URL  : http://127.0.0.1:{{ jenkins_port }}"
          - "ngrok public URL   : {{ ngrok_public_url }}"
          - "Jenkins init pass  : cat /var/lib/jenkins/secrets/initialAdminPassword"
          - "ngrok dashboard    : http://127.0.0.1:4040"
          - "============================================="
